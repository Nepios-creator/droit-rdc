function dayLabel(t){const d=new Date(t),n=new Date(),y=new Date(n);y.setDate(n.getDate()-1);const k=x=>x.toDateString();return k(d)===k(n)?"Aujourd'hui":k(d)===k(y)?'Hier':d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:d.getFullYear()!==n.getFullYear()?'numeric':undefined})}
function gRender(stick){const L=$('#gl');if(!L)return;let last='',h='';
 for(const m of GM){const dl=dayLabel(m.t);if(dl!==last){h+=`<div class="dsep"><span>${esc(dl)}</span></div>`;last=dl}
  h+=`<div class="gm${m.mine?' mine':''}" data-id="${m.id}"><div class="gav" style="background:hsl(${hue(m.a)} 55% 45%)">${esc(m.a.slice(-2))}</div><div class="gb"><div class="gh"><b>${m.mine?'Vous · ':''}${esc(m.a)}</b> · ${hm(m.t)}</div>${m.rq?`<div class="gq"><b>${esc(m.rq.a)}</b> : ${esc(m.rq.t)}</div>`:''}<div class="gt">${esc(m.b)}</div><div class="gx"><button data-r="${m.id}">↩︎ Répondre</button><button data-c="${m.id}">Copier</button></div></div></div>`}
 L.innerHTML=h||'<p class="mute" style="text-align:center">Aucun message pour l\'instant. Lancez la discussion !</p>';
 $('#gm').style.display=gMore?'flex':'none';
 $$('#gl [data-r]').forEach(b=>b.onclick=()=>{const m=GM.find(x=>x.id==b.dataset.r);gReply=m;const r=$('#gr');r.style.display='block';r.innerHTML=`↩︎ Réponse à <b>${esc(m.a)}</b> : ${esc(m.b.slice(0,90))} <button class="btn" id="gx" style="padding:2px 8px;margin-left:6px">✕</button>`;$('#gx').onclick=()=>{gReply=null;r.style.display='none'};$('#gi').focus()});
 $$('#gl [data-c]').forEach(b=>b.onclick=()=>{const m=GM.find(x=>x.id==b.dataset.c);navigator.clipboard&&navigator.clipboard.writeText(m.b).then(()=>flash(b,'Copié ✓'))});
 if(stick)setTimeout(()=>scrollTo({top:document.body.scrollHeight}),30)}
function grpInit(){const el=$('#v-grp');
 if(!$('#gl')){el.innerHTML=`<div class="aihead"><div><b>Groupe d'étude public</b><span class="mute">Anonyme · débats juridiques ouverts 24 h/24</span></div></div><div class="card mute" style="font-size:12.5px">Les échanges sont publics. Les autres membres vous voient sous un pseudonyme, jamais sous votre nom. Restez courtois, ne partagez aucune information personnelle. Ce n'est pas un avis juridique.</div><div id="gm" class="row" style="display:none;justify-content:center"><button class="btn" id="gmore">Voir les messages plus anciens</button></div><div id="gl"></div><div id="gr" class="replybar" style="display:none"></div><div class="composer"><textarea id="gi" rows="1" maxlength="1500" placeholder="Partagez une connaissance ou posez une question…"></textarea><button class="send" id="gs" aria-label="Envoyer">➤</button></div>`;
  const t=$('#gi');t.oninput=()=>{t.style.height='auto';t.style.height=Math.min(t.scrollHeight,140)+'px'};
  $('#gs').onclick=gSend;
  $('#gmore').onclick=async()=>{try{const r=await gcall({op:'gpull',id:me.id,token:me.token,before:GM[0]&&GM[0].id,limit:40});if(r.msgs){GM=r.msgs.concat(GM);gMore=r.more;gRender(false)}}catch(e){}}}
 $('#gdot').classList.remove('on');
 if(!gInit)gLoad();else{gRender(true);gTick()}}
async function gLoad(){try{const r=await gcall({op:'gpull',id:me.id,token:me.token,limit:40});if(r.msgs){GM=r.msgs;gMore=r.more;gInit=true;gRender(true)}else $('#gl').innerHTML='<p class="mute" style="text-align:center">Groupe indisponible pour le moment.</p>'}catch(e){$('#gl').innerHTML='<p class="mute" style="text-align:center">Connexion internet requise pour le groupe.</p>'}}
async function gSend(){const t=$('#gi'),v=t.value.trim();if(v.length<2)return;$('#gs').disabled=true;
 try{const r=await gcall({op:'gpost',id:me.id,token:me.token,body:v,reply_to:gReply&&gReply.id});
  if(r.ok){t.value='';t.style.height='auto';gReply=null;$('#gr').style.display='none';await gTick(true)}
  else alert(r.error==='rate'?'Vous écrivez trop vite. Réessayez dans quelques minutes.':'Envoi impossible. Réessayez.')}
 catch(e){alert('Connexion internet requise.')}
 $('#gs').disabled=false}
async function gTick(force){if(!me||!gInit||document.body.classList.contains('locked'))return;const on=$('#v-grp').classList.contains('on');
 try{const last=GM.length?GM[GM.length-1].id:0;const r=await gcall({op:'gpull',id:me.id,token:me.token,after:last});
  if(r.msgs&&r.msgs.length){const near=innerHeight+scrollY>document.body.scrollHeight-160;GM=GM.concat(r.msgs);if(on)gRender(force||near);else if(r.msgs.some(m=>!m.mine))$('#gdot').classList.add('on')}}catch(e){}}
setInterval(()=>{if(!document.hidden)gTick()},8000);
async function adminGroup(){const H=()=>({'x-admin-key':sessionStorage.getItem('ak')||''});let L=[];try{const r=await gcall({op:'gadmin',action:'glist'},H());L=r.msgs||[]}catch(e){}
 G(`<div class="book" style="align-items:flex-start"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Modération du groupe</h2><button class="btn" id="mq">Retour</button></div><p class="mute">Derniers messages. Supprimez ceux qui enfreignent les règles ; ils disparaissent aussitôt pour les membres.</p>${L.map(m=>`<div class="u"><b>${esc(m.a)}</b> <span class="mute">${new Date(m.t).toLocaleString('fr-FR')}${m.del?' · supprimé':''}</span><div style="margin:4px 0;white-space:pre-wrap;word-break:break-word">${esc(m.b)}</div><button class="btn" data-m="${m.id}" data-a="${m.del?'grestore':'gdel'}">${m.del?'Rétablir':'Supprimer'}</button></div>`).join('')||'<p class="mute">Aucun message.</p>'}</div></div>`);
 $('#mq').onclick=()=>adminList();$$('[data-m]').forEach(b=>b.onclick=async()=>{await gcall({op:'gadmin',action:b.dataset.a,id:b.dataset.m},H());adminGroup()})}

function toCover(){try{localStorage.removeItem('st')}catch(e){}document.body.classList.add('locked');cover()}
function logout(){if(!confirm('Se déconnecter et effacer les données de ce téléphone ?'))return;['me','data','ver','meta','st','pend'].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});me=null;D=null;setData(null);CH=[];curC=null;idbSet('chats',null);gInit=false;GM=[];toCover()}
(async function(){await chLoad();let v=await idbGet('data');if(!v){try{const o=JSON.parse(localStorage.getItem('data'));if(o){v=o;idbSet('data',o)}localStorage.removeItem('data')}catch(e){}}DC=v;
 const st=ld('st'),d=DC;if(me&&d&&st&&Date.now()-st.t<432e5){initApp(d);restore();if(!STATIC)check(true)}else{cover();if(!STATIC&&me&&d)check(true)}})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
</script></body></html>
