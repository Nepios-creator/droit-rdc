<main>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let D,A=[],ann=[];const K='ann_loi_v1';
try{ann=JSON.parse(localStorage.getItem(K)||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(ann))}catch(e){}};
let fs=+(localStorage.getItem('fs')||18);const setfs=()=>document.documentElement.style.setProperty('--fs',fs+'px');setfs();
$('#fm').onclick=()=>{fs=Math.max(14,fs-1);localStorage.setItem('fs',fs);setfs()};
$('#fp').onclick=()=>{fs=Math.min(28,fs+1);localStorage.setItem('fs',fs);setfs()};
function show(v){curV=v;setTimeout(saveState,0);$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));if(v==='notes')renderNotes();if(v==='me')renderMe();if(v==='ai')aiInit();if(v==='lib')renderLib();hideBar()}
$$('nav button').forEach(b=>b.onclick=()=>show(b.dataset.v));
function go(id){if(id.includes(':')&&(!D||D.id!==id.split(':')[0]))openDoc(id.split(':')[0]);show('lire');$('#drawer').classList.remove('on');const el=document.getElementById(id);if(el){el.scrollIntoView({behavior:'smooth',block:'start'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),1800)}}
function paraHTML(a,pi){const t=a.p[pi];const segs=[];ann.forEach(n=>n.segs.forEach(s=>{if(s.a===a.gid&&s.p===pi)segs.push({s:s.s,e:s.e,n})}));
 if(!segs.length)return esc(t);const cuts=new Set([0,t.length]);segs.forEach(g=>{cuts.add(g.s);cuts.add(Math.min(g.e,t.length))});
 const c=[...cuts].sort((x,y)=>x-y);let h='';for(let i=0;i<c.length-1;i++){const x=c[i],y=c[i+1];const cov=segs.filter(g=>g.s<=x&&g.e>=y);const part=esc(t.slice(x,y));
  if(!cov.length)h+=part;else{const n=cov[cov.length-1].n;h+=`<mark class="c-${n.c}${n.note?' has-note':''}" data-id="${n.id}">${part}</mark>`}}return h}
function renderArt(a){return `<article id="${a.gid}" data-a="${a.gid}"><b>${esc(a.n)}</b>${a.p.map((_,i)=>`<p data-p="${i}">${paraHTML(a,i)}</p>`).join('')}</article>`}
function renderDoc(){$('#doc').innerHTML=`<h1 style="font:700 24px Georgia,serif;color:var(--pri);margin:6px 0">${esc(D.title)}</h1>`+D.items.map(x=>x.t==='h'?`<h2 class="h l${x.lvl}" id="h${x.i}">${esc(x.text)}</h2>`:renderArt(x)).join('')}
function refreshArt(id){const a=ALL.find(x=>x.gid===id),el=document.getElementById(id);if(!el)return;el.querySelectorAll('p').forEach(p=>p.innerHTML=paraHTML(a,+p.dataset.p))}
function daily(){const d=Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);const pool=ALL.filter(a=>!a.annex&&a.p.join(' ').length>90);const a=pool[(d*7919)%pool.length];
 const txt=a.p.join(' ');const q=txt.length>260?txt.slice(0,257).replace(/\s+\S*$/,'')+'…':txt;
 $('#daily').innerHTML=`<div class="card daily"><small>Article du jour · ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'})}</small><q>« ${esc(q)} »</q><div class="row"><span class="mute" style="align-self:center">${esc(a.dt)} · ${esc(a.n)}</span><button class="btn p" id="dgo">Lire l'article</button><button class="btn" id="dsh">Partager</button></div></div>`;
 $('#dgo').onclick=()=>go(a.gid);

 G(`<div class="book" style="align-items:flex-start"><div class="panel"><div class="row" style="justify-content:space-between"><h2>Documents ajoutés</h2><button class="btn" id="dq">Retour</button></div>

<label>Icône</label><input id="di1" type="text" value="📖" maxlength="4"><label>Texte du document</label><textarea id="dx1" rows="7" placeholder="Collez le texte ici…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:15px"></textarea>
<input id="df1" type="file" accept=".txt,.md,text/plain" style="margin:8px 0"><button class="btn p" id="da">Ajouter à la bibliothèque</button><p id="dm" class="${msg&&msg.err?'err':'mute'}">${esc((msg&&msg.t)||'')}</p><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">
${L.map(d=>`<div class="u"><b>${esc(d.icon)} ${esc(d.title)}</b><span class="tag">${esc(d.section)}</span><div class="mute">${d.n} éléments</div><button class="btn" data-del="${d.id}" style="margin-top:6px">Supprimer</button></div>`).join('')||'<p class="mute">Aucun document ajouté pour l\'instant.</p>'}</div></div>`);
 $('#dq').onclick=()=>adminList();
 $('#df1').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('#dx1').value=r.result;if(!$('#dt1').value)$('#dt1').value=f.name.replace(/\.[^.]+$/,'')};r.readAsText(f)};
 $('#da').onclick=async()=>{const b={action:'adddoc',title:$('#dt1').value,section:$('#ds1').value,icon:$('#di1').value,text:$('#dx1').value};$('#da').disabled=true;
  try{const r=await post('admin',b,{'x-admin-key':sessionStorage.getItem('ak')||''});if(r.ok)adminDocs({t:`Ajouté : ${r.n} éléments publiés.`});else{$('#da').disabled=false;$('#dm').className='err';$('#dm').textContent=r.error==='missing'?'Titre et texte obligatoires.':r.error==='empty'?'Aucun contenu exploitable.':'Erreur. Réessayez.'}}catch(e){$('#da').disabled=false;$('#dm').className='err';$('#dm').textContent='Connexion impossible.'}};
